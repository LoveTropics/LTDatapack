name: Build Mods

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - run: |
          zip -r lt-assets-${{ github.run_number }}.jar assets/ META-INF/ pack.mcmeta
          zip -r lt-data-${{ github.run_number }}.jar data/ META-INF/ pack.mcmeta

      - uses: actions/upload-artifact@v4
        with:
          name: lt
          path: |
            lt-assets-${{ github.run_number }}.jar
            lt-data-${{ github.run_number }}.jar
